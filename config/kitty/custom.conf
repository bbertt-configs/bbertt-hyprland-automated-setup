# Custom Keybindings and style
map ctrl+shift+, previous_tab
map ctrl+shift+. next_tab
map ctrl+shift+left  move_tab_backward
map ctrl+shift+right move_tab_forward
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Font 

# ===========================================
# Cascadia Code NF
# ===========================================
# font_family Cascadia Code NF
# bold_font   auto
# italic_font auto
# font_features CascadiaCodeNF-Regular +ss01
# font_features CascadiaCodeNF-Italic +ss01
# font_features CascadiaCodeNF-BoldItalic +ss01

# ===========================================
# JetBrains
# ===========================================
# 1. Primary Font Family (Updated to JetBrainsMono Nerd Font)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# 2. Font Features (Optional, highly recommended for ligatures)
# The '+liga' feature enables programming ligatures (e.g., '->' becomes a single arrow character).
font_features JetBrainsMono Nerd Font +liga

# 3. Optional: Cursive Italic Feature (ss04)
# JetBrains Mono uses stylistic set 'ss04' for a specific cursive italic style, 
# although the default italic is often sufficient. Uncomment to try it out.
font_features JetBrainsMono Nerd Font +ss04

font_size        13
window_padding_width        0
background_opacity          1

## Custom Omarchy

# Allow remote access
single_instance yes
allow_remote_control yes

# Aesthetics
cursor_shape block
enable_audio_bell no

# Minimal Tab bar styling 
# tab_bar_edge                bottom
# tab_bar_style               powerline
# tab_powerline_style         slanted
tab_bar_margin_height       0.0 0.0
# tab_title_template          [{index}]{title}
tab_title_template          {index}

