---
# Sonuscape Mouseless (mouseless.click) — keyboard-driven mouse control.
# Coexists with jbensmann/mouseless, which handles key remapping (CapsLock nav layer).

mouseless_click_packages:
  - flatpak

# The sonuscape repo hosts ONLY the app + its Locale extension. The app declares
# runtime=org.gnome.Platform/x86_64/50, which is not in that repo — so Flathub is
# required or the install fails with an unresolved runtime.
mouseless_click_flathub_name: flathub
mouseless_click_flathub_url: https://dl.flathub.org/repo/flathub.flatpakrepo

mouseless_click_remote_name: sonuscape
mouseless_click_remote_url: https://dl.sonuscape.net/flatpak/sonuscape.flatpakrepo

mouseless_click_app_id: net.sonuscape.mouseless
mouseless_click_flatpak_method: user

# Hyprland autostart. Written into the hyprlink-managed dotfiles repo, so this role
# must run AFTER hyprlink (which does a force git update and would discard the block).
mouseless_click_startup_file: "{{ ansible_user_dir }}/.config/hypr/UserConfigs/Startup_Apps.conf"
mouseless_click_marker: "# {mark} ANSIBLE MANAGED — mouseless.click autostart"

# Name of jbensmann's uinput keyboard. The autostart waits for this device so
# jbensmann wins the exclusive EVIOCGRAB on the physical keyboards.
mouseless_click_wait_device: "mouseless keyboard"
mouseless_click_wait_timeout: 30

# Refresh helper. Hotplugging a keyboard lets whichever program reacts first win the
# exclusive grab, so an external keyboard can silently lose the nav layer. This script
# restarts jbensmann and reports which program holds any device it could not reclaim.
# Installed outside the hyprlink-managed dotfiles repo so a force git update cannot
# remove it; the keybind itself does live in that repo and is re-applied each run.
mouseless_click_refresh_script_src: files/mouseless-refresh
mouseless_click_refresh_script_dest: "{{ ansible_user_dir }}/.local/bin/mouseless-refresh"
mouseless_click_keybind_file: "{{ ansible_user_dir }}/.config/hypr/UserConfigs/UserKeybinds.conf"
mouseless_click_keybind_marker: "# {mark} ANSIBLE MANAGED — mouseless refresh keybind"
mouseless_click_refresh_bind: "$mainMod CTRL ALT, R"

# Mouseless grabs every keyboard it classifies as one, including newly hotplugged
# ones and jbensmann's virtual output. Excluding the PHYSICAL keyboards leaves it
# grabbing only jbensmann's "mouseless keyboard", so jbensmann reliably owns the
# real hardware no matter what order things start or how often a keyboard is
# replugged. Mouseless still sees every keystroke, because jbensmann passes them
# through to that virtual device.
#
# Entries match by case-insensitive name substring, or by id (ids:VVVV:PPPP).
# Discover values with: flatpak run net.sonuscape.mouseless --list-input-devices
# HOST-SPECIFIC — override per machine. Keep entries specific enough not to also
# match "mouseless keyboard", or Mouseless is left with no input at all.
mouseless_click_config: "{{ ansible_user_dir }}/.var/app/net.sonuscape.mouseless/data/mouseless/configs/config.yaml"
mouseless_click_excluded_devices:
  - AT Translated Set 2 keyboard
  - AULA-F75
