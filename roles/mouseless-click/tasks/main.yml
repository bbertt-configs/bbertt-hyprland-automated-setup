---
# Tagged `packages` so it can be skipped where flatpak is provisioned elsewhere:
#   --skip-tags packages
- name: Install flatpak
  tags: [mouseless-click, packages]
  become: true
  community.general.pacman:
    name: "{{ mouseless_click_packages }}"
    state: present

- name: Add Flathub remote (provides org.gnome.Platform/50 runtime)
  tags: [mouseless-click]
  community.general.flatpak_remote:
    name: "{{ mouseless_click_flathub_name }}"
    flatpakrepo_url: "{{ mouseless_click_flathub_url }}"
    method: "{{ mouseless_click_flatpak_method }}"
    state: present

- name: Add Sonuscape remote
  tags: [mouseless-click]
  community.general.flatpak_remote:
    name: "{{ mouseless_click_remote_name }}"
    flatpakrepo_url: "{{ mouseless_click_remote_url }}"
    method: "{{ mouseless_click_flatpak_method }}"
    state: present

- name: Install Mouseless flatpak
  tags: [mouseless-click]
  community.general.flatpak:
    name: "{{ mouseless_click_app_id }}"
    remote: "{{ mouseless_click_remote_name }}"
    method: "{{ mouseless_click_flatpak_method }}"
    state: present

- name: Ensure Hyprland UserConfigs directory exists
  tags: [mouseless-click]
  ansible.builtin.file:
    path: "{{ mouseless_click_startup_file | dirname }}"
    state: directory
    mode: '0755'

# Order is critical. Whichever program starts first wins the exclusive EVIOCGRAB on
# the physical keyboards. jbensmann must win: without the grab it cannot suppress the
# original keystroke, so CapsLock+h would emit both "h" and Left arrow. Waiting for its
# uinput device is deterministic, unlike a fixed sleep. If jbensmann never comes up the
# loop times out and Mouseless grabs the physical keyboards directly — degrading to
# "no CapsLock arrows" rather than "no mouse control at all".
- name: Configure Mouseless autostart in Hyprland
  tags: [mouseless-click]
  ansible.builtin.blockinfile:
    path: "{{ mouseless_click_startup_file }}"
    marker: "{{ mouseless_click_marker }}"
    create: true
    mode: '0644'
    block: |
      exec-once = sh -c 'for i in $(seq 1 {{ mouseless_click_wait_timeout }}); do grep -q "{{ mouseless_click_wait_device }}" /proc/bus/input/devices && break; sleep 1; done; flatpak run {{ mouseless_click_app_id }}'

- name: Ensure ~/.local/bin exists
  tags: [mouseless-click]
  ansible.builtin.file:
    path: "{{ mouseless_click_refresh_script_dest | dirname }}"
    state: directory
    mode: '0755'

- name: Install mouseless refresh helper
  tags: [mouseless-click]
  ansible.builtin.copy:
    src: "{{ mouseless_click_refresh_script_src }}"
    dest: "{{ mouseless_click_refresh_script_dest }}"
    mode: '0755'

# UserKeybinds.conf is the file the dotfiles explicitly reserve for user binds, and
# hyprland.conf already sources it. Managed with blockinfile because hyprlink force
# updates that repo, which would otherwise drop the bind.
- name: Bind mouseless refresh in Hyprland
  tags: [mouseless-click]
  ansible.builtin.blockinfile:
    path: "{{ mouseless_click_keybind_file }}"
    marker: "{{ mouseless_click_keybind_marker }}"
    create: true
    mode: '0644'
    block: |
      bindd = {{ mouseless_click_refresh_bind }}, refresh mouseless layers, exec, {{ mouseless_click_refresh_script_dest }}

# Only rewrites the empty default, so it provisions a fresh install without ever
# clobbering settings made in the app's own config editor. Mouseless owns this file;
# Ansible deliberately does not manage the rest of it.
- name: Exclude physical keyboards from Mouseless grabs
  tags: [mouseless-click]
  when: mouseless_click_excluded_devices | length > 0
  ansible.builtin.replace:
    path: "{{ mouseless_click_config }}"
    regexp: '^excluded_input_devices: \[\]$'
    replace: |-
      excluded_input_devices:
      {% for d in mouseless_click_excluded_devices %}
      - {{ d }}
      {% endfor %}
  register: mouseless_click_exclusions

- name: Note that Mouseless must restart to apply exclusions
  tags: [mouseless-click]
  when: mouseless_click_exclusions.changed
  ansible.builtin.debug:
    msg: >-
      Device exclusions written. Mouseless caches its config in memory and saves on
      exit, so a running instance will overwrite this file when it quits. Quit it from
      its own UI (tap Left Shift, then Tab) and relaunch, or log out and back in.
