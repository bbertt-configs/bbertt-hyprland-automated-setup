# ----------------------------------
# jbensmann/mouseless — key remapping only
#
# Mouse control is handled by Sonuscape Mouseless (mouseless.click), see the
# mouseless-click role. This config is deliberately limited to the CapsLock nav
# layer, because Mouseless has no key-remapping capability of its own.
#
# Two things here exist purely so the two programs can coexist:
#
#   1. No `leftctrl` binding. Mouseless binds "toggle free mode: ControlLeft tap",
#      so the old `leftctrl: tap-hold-next layer mouse` fired both on one tap.
#   2. `devicesExclude` below, which breaks a feedback loop between the two.
#
# CapsLock itself is unbound in Mouseless, so the nav layer needs no special handling.
# ----------------------------------

# Do not read Mouseless's own virtual devices. Without this, jbensmann remaps the
# keystrokes Mouseless synthesizes and feeds them back in — a feedback loop between
# the two programs. Excluding by Mouseless's device names (stable across machines)
# rather than whitelisting physical keyboards (host-specific) keeps this portable.
devicesExclude:
  - "Mouseless-Virtual-Device"
  - "Mouseless-Virtual-Keyboard-WL"

quickTapTime: 150
comboTime: 25

layers:
  # ==================================
  # INITIAL LAYER (default)
  # ==================================
  - name: initial
    bindings:
      # CapsLock toggles nav layer
      capslock: toggle-layer nav

  # ==================================
  # NAVIGATION LAYER (keyd-like behavior)
  # ==================================
  - name: nav
    passThrough: false
    bindings:
      h: left
      j: down
      k: up
      l: right
      n: down
      p: up

      # CapsLock toggles back to initial
      capslock: toggle-layer initial
