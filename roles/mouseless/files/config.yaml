# ----------------------------------
# General settings
# ----------------------------------

baseMouseSpeed: 500.0
baseScrollSpeed: 10.0

quickTapTime: 150
comboTime: 25
layers:
  # ==================================
  # INITIAL LAYER (default)
  # ==================================
  - name: initial
    bindings:
      # CapsLock toggles nav layer
      capslock: toggle-layer nav

      # LeftCtrl: quick tap enters mouse layer, hold/combo stays a normal ctrl
      leftctrl: tap-hold-next layer mouse ; leftctrl ; 200

  # ==================================
  # NAVIGATION LAYER (your keyd-like behavior)
  # ==================================
  - name: nav
    passThrough: false
    bindings:
      h: left
      j: down
      k: up
      l: right
      n: down
      p: up

      # CapsLock toggles back to initial
      capslock: toggle-layer initial

  # ==================================
  # MOUSE CONTROL LAYER
  # ==================================
  - name: mouse
    passThrough: true
    bindings:
      # exit mouse layer
      esc: layer initial
      leftctrl: layer initial
      # capslock: layer initial

      # mouse motion
      h: move -1  0
      l: move  1  0
      k: move  0 -1
      j: move  0  1

      # speed control (hold to modify cursor speed)
      a: speed 0.3 # slow down
      s: speed 2.0 # speed up
      d: speed 3.0 # speed up more (faster than s)

      # scrolling
      n: scroll up
      m: scroll down
      comma: scroll left
      dot: scroll right

      # clicks
      space: button left
      f: button left
      g: button right
      v: button middle
